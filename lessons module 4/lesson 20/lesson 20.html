<!DOCTYPE html>
<html>

<head>
    <title>Functions></title>
</head>

<body>
    <button onclick="myfunction(67)">Execute JS Functions</button>
    <script>
        function myfunction(x,y) {
            if (y === undefined) {
                y = 1;
            }
            document.write(x * y);
        }
    </script>
</body>
</html>
