<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            background-color: azure;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        button {
            background-color: rgb(88, 227, 170);
            width: 340px;
            height: 300px;
            font-size: 18px;
        }

        #result {
            color: #ff4500;
            font-size: 30px;
            font-weight: bold;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <h2>Here is a button that will show the result of a simple calculation.<br>
        Try to guess which numbers are being used...<br><br><br><br><br>
    </h2>

<button onclick="multiply(3)">Click Me</button>
<p id="result"></p>

<script>
function multiply(a, b) {

    if (b === undefined) {
        b = 10;
    }
    
    var total = a * b;
    document.getElementById("result").innerHTML = total;
}
</script>

</body>
</html>
