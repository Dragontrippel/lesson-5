<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Superhero Power Cards</title>

  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f0f4f8;
      color: #1e293b;
      text-align: center;
      margin: 0;
      padding: 40px 20px;
    }

    h1 {
      color: #0f172a;
      font-size: 2.5rem;
      margin-bottom: 10px;
      letter-spacing: -0.5px;
    }

    p {
      color: #475569;
      max-width: 600px;
      margin: 0 auto 30px auto;
      line-height: 1.6;
    }

    button {
      background-color: #0284c7;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      padding: 12px 28px;
      cursor: pointer;
      font-weight: 600;
      font-size: 1rem;
      box-shadow: 0 4px 14px rgba(2, 132, 199, 0.25);
      transition: transform 0.1s ease, background-color 0.2s ease, box-shadow 0.2s ease;
      margin: 15px 0;
    }

    button:hover {
      background-color: #0369a1;
      box-shadow: 0 6px 20px rgba(2, 132, 199, 0.35);
    }

    button:active {
      transform: scale(0.98);
    }

    .card-container {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 25px;
      flex-wrap: wrap;
    }

    .hero-card {
      background-color: #ffffff;
      border: 4px double #0284c7;
      border-radius: 16px;
      width: 240px;
      padding: 20px;
      text-align: left;
      box-shadow: 0 10px 30px rgba(2, 132, 199, 0.06);
      transition: transform 0.3s ease;
    }

    .hero-card:hover {
      transform: translateY(-5px);
    }

    .hero-name {
      font-size: 22px;
      font-weight: bold;
      color: #0f172a;
      margin: 0 0 12px 0;
    }

    .hero-power {
      color: #0369a1;
      font-weight: 600;
      margin: 0 0 8px 0;
      background-color: #e0f2fe;
      padding: 4px 8px;
      border-radius: 6px;
      display: inline-block;
      font-size: 14px;
    }

    .hero-mission {
      color: #64748b;
      font-size: 14px;
      line-height: 1.5;
      margin: 8px 0 0 0;
    }
  </style>
</head>

<body>

  <h1>My Superhero Power Cards</h1>

  <p>
    Click the button to create superhero objects using JavaScript classes.
  </p>

  <button onclick="showHeroes()">Show Superheroes</button>

  <div class="card-container" id="heroCards"></div>

  <script>
    class Superhero {
      constructor(name, power, mission) {
        this.name = name;
        this.power = power;
        this.mission = mission;
      }

      describeHero() {
        return "<div class='hero-card'>" +
               "<p class='hero-name'>" + this.name + "</p>" +
               "<p class='hero-power'>Power: " + this.power + "</p>" +
               "<p class='hero-mission'><strong>Mission:</strong> " + this.mission + "</p>" +
               "</div>";
      }
    }

    function showHeroes() {
      let hero1 = new Superhero(
        "Batman 🦇",
        "Martial arts & high-tech gadgets",
        "Protect Gotham City from crime and corruption."
      );

      let hero2 = new Superhero(
        "Peter Parker 🕷️",
        "Spider-sense & web-slinging",
        "Protect New York City while balancing normal high school life."
      );

      let hero3 = new Superhero(
        "Miles Morales ⚡",
        "Bio-electricity & invisibility",
        "Defend Brooklyn and prove he can carry the Spider-Man legacy."
      );

      let hero4 = new Superhero(
        "Gwen Stacy 🕸️",
        "Superhuman agility & dimensional travel",
        "Keep the multiverse safe alongside her spider-allies."
      );

      document.getElementById("heroCards").innerHTML =
        hero1.describeHero() +
        hero2.describeHero() +
        hero3.describeHero() +
        hero4.describeHero();
    }
  </script>

</body>
</html>
