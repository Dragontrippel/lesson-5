<!DOCTYPE html>
<html>
<head>
  <title>My Bank App</title>
  <link rel="stylesheet" href="style 36 hw.css">
</head>
<body>

  <div id="app">
    <h1 id="app-title">My bank</h1>

    <div id="balance-box">
      <p id="balance-label">Available balance</p>
      <p id="balance">1000</p>
    </div>

    <div id="entry-box">
      <label id="amount-label" for="amount">Enter amount</label>
      <input type="number" id="amount" placeholder="0">
    </div>

    <div id="button-box">
      <button class="action credit" id="credit-btn">Credit</button>
      <button class="action debit" id="debit-btn">Debit</button>
    </div>

    <p id="note">Terms and conditions apply</p>
  </div>

<script>
    let balance = 1000;

    document.getElementById("credit-btn").onclick = function() {
        let amount = Number(document.getElementById("amount").value);
        balance = balance + amount;
        document.getElementById("balance").innerHTML = balance;
    }

    document.getElementById("debit-btn").onclick = function() {
        let amount = Number(document.getElementById("amount").value);

        if (amount <= balance && amount > 0) {
            balance = balance - amount;
            document.getElementById("balance").innerHTML = balance;
        } else {
            alert("Insufficient balance or invalid amount!");
        }
    }
</script>
</body>
</html>

</body>
</html>
