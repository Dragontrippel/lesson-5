<!DOCTYPE html>
<html >
<head>
    <title>The Food Spot</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            min-height: 100vh;
            overflow: hidden;

            background-image: url(BG_img_32_hw.png);
            background-size: 100% 100%;
            background-position: center;

        }

        .buttons {
            position: absolute;
            top: 20px;
            right: 25px;
            gap: 20px;
        }

        .buttons .btn {
            font-size: 16px;
            padding: 12px 20px;
            border-radius: 80px;
        }

        @media (max-width: 600px) {
            .buttons {
                top: 10px;
                right: 10px;
                left: 10px;
                gap: 6px;
            }

            .buttons .btn {
                font-size: 12px;
                padding: 7px 10px;
            }
        }
    </style>
</head>

<body>


    <div class="buttons">

        <button class="btn btn-primary btn-lg" type="button">
            About
        </button>

        <button class="btn btn-success btn-lg" type="button">
            Reservations
        </button>

        <button
            class="btn btn-lg"
            type="button"
            style="background-color: #008CBA; color: white;"
        >
            Menu
        </button>

        <button class="btn btn-danger btn-lg" type="button">
            Shop/Order
        </button>

    </div>

</body>
</html>
