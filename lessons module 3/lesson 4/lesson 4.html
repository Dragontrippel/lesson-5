<!DOCTYPE html>

<html>

<head>
  <title>Bootstrap utillities</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body>

    <div class="container mt-4">



        <div class="p-5 mb-4 jumbotron rounded-3 shadow">
            <div class="container-fluid py-5">
                <h1 class="display-5 fw-bold">Welcome to bootstrap Demo</h1>
                <p class="col-md-8 fs-4">
                    This page demonstrates Bootstrap utillities such as a button. badges and progress bars.
                </p>
                <button class="btn btn-primary btn-lg">Learn more</button>
            </div>
        </div>


    <h2>Butons</h2>
    <button class="btn btn-primary active">Primary</button>
    <button class="btn btn-success ">Success</button>
    <button class="btn btn-warning ">Warning</button>
    <button class="btn btn-danger">Danger</button>

    <hr>



    <h2>
        Notification
        <span class="badge bg-danger">5</span>
    </h2>

    <button class="btn btn-info">
        Messages <span class="bagde bg-secondary">10</span>
    </button>

    <hr>


    <h2>Progress bars</h2>

    <p>HTML Progress</p>
    <div class="progress mb-3">
        <div class="progress-bar bg-info" role="progressbar" style="width: 90%;">
            90%
        </div>
    </div>

    <p>CSS Progress</p>
    <div class="progress mb-3">
        <div class="progress-bar bg-info " role="progressbar" style="width: 75%;">
            75%
        </div>
    </div>

    <p>JavaScript  progress</p>
    <div class="progress">
        <div class="progress-bar progress-bar-striped progress-bar-animated bg-succes"
        style="width: 70%;">70%</div>
    </div>
</body>



</html>
