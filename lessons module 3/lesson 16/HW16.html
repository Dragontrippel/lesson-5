<!DOCTYPE html>
<html lang="en">
<head>
  <title>My Study Progress Dashboard</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">

  <style>
    body { background-color: #f4f7ff; font-family: Arial, sans-serif; }
    .jumbotron { background-color: #e8edff; border-left: 6px solid #FF5A43; }
    .jumbotron h1 { color: #FF5A43; }
    .section-title { color: #FF5A43; margin-top: 30px; margin-bottom: 15px; }
    p { font-weight: bold; margin-bottom: 5px; }
  </style>
</head>
<body>

  <div class="jumbotron jumbotron-fluid">
    <div class="container">
      <h1>My Study Progress Dashboard</h1>
      <p class="lead">Track your subjects, completed lessons, and learning progress in one place.</p>


      <button class="btn btn-primary">HTML</button>
      <button class="btn btn-success">CSS</button>
      <button class="btn btn-warning">JavaScript</button>
      <button class="btn btn-danger">JavaScript</button>
    </div>
  </div>

  <div class="container">


    <h2 class="section-title">Lessons Completed <span class="badge badge-danger">24</span></h2>

    <p>HTML<span class="badge badge-primary">6 lessons</span></p>
    <p>CSS <span class="badge badge-success">6 lessons</span></p>
    <p>JavaScript <span class="badge badge-warning">6 lessons</span></p>
    <p>JavaScript <span class="badge badge-info">6 lessons</span></p>

 
    <h2 class="section-title">Subject Progress</h2>

    <p>HTML</p>
    <div class="progress mb-3">
      <div class="progress-bar bg-primary" style="width: 100%">100%</div>
    </div>

    <p>CSS</p>
    <div class="progress mb-3">
      <div class="progress-bar bg-success" style="width: 100%">100%</div>
    </div>

    <p>JavaScript</p>
    <div class="progress mb-3">
      <div class="progress-bar bg-warning" style="width: 75%">75%</div>
    </div>

    <p>JavaScript</p>
    <div class="progress mb-3">
      <div class="progress-bar bg-danger" style="width: 56%">56%</div>
    </div>

  </div>

  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>
</body>
</html>
